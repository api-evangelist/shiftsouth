name: ShiftSouth
description: >-
  ShiftSouth (Pty) Ltd operates SweepSouth, South Africa's first on-demand home
  services marketplace, launched in 2014. The platform connects roughly 250,000
  customers with about 6,500 vetted home-services professionals ("SweepStars")
  across Cape Town, Johannesburg, Sandton, Centurion, Pretoria, Durban, Umhlanga,
  Stellenbosch, Paarl and other South African cities. Services span on-demand and
  express indoor cleaning, office and Airbnb turnover cleaning, laundry and
  ironing, elder care, Mom's Helper and childcare, dog walking, gardening and pool
  maintenance, plus full-time placements of housekeepers, nannies and carers and a
  MyHome Hub subscription for managing private domestic workers. Professionals are
  background-checked, reference-verified and insured. SweepSouth is a 500 Global
  portfolio company and has won the Forbes Africa Women Innovation Award (2020) and
  the World Economic Forum Breakthrough Female Innovators Award (2017). It is a
  consumer marketplace with mobile apps for iOS and Android and does not publish a
  public developer API surface.
